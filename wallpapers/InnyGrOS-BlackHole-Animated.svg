<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>InnyGrOS — Black Hole / Team Blacklight Animated Wallpaper</title>
  <desc>A lightweight animated SVG space wallpaper with a violet-cyan accretion disk, black hole, stars, and InnygrCorp and Team Blacklight branding.</desc>
  <defs>
    <radialGradient id="space">
      <stop offset="0" stop-color="#11102b"/><stop offset=".5" stop-color="#07091b"/><stop offset="1" stop-color="#010208"/>
    </radialGradient>
    <radialGradient id="nebula">
      <stop offset="0" stop-color="#6b25c9" stop-opacity=".55"/><stop offset=".45" stop-color="#1a4eaa" stop-opacity=".22"/><stop offset="1" stop-color="#02030b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#4612a8"/><stop offset=".22" stop-color="#9b4dff"/><stop offset=".42" stop-color="#45dfff"/><stop offset=".58" stop-color="#f6c56b"/><stop offset=".76" stop-color="#9e48ff"/><stop offset="1" stop-color="#20126b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a66bff"/><stop offset=".55" stop-color="#f4f3ff"/><stop offset="1" stop-color="#37e6ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
    <clipPath id="lowerDisk"><rect x="0" y="520" width="1920" height="260"/></clipPath>
    <g id="star"><circle r="1.6" fill="#d7eaff"/><circle r="4" fill="#70dfff" opacity=".25" filter="url(#glow)"/></g>
  </defs>
  <rect width="1920" height="1080" fill="url(#space)"/>
  <ellipse cx="510" cy="450" rx="690" ry="410" fill="url(#nebula)"/>
  <ellipse cx="1420" cy="360" rx="650" ry="430" fill="url(#nebula)" opacity=".8"/>
  <g fill="#d8e7ff">
    <circle cx="80" cy="245" r="1.5"/><circle cx="150" cy="410" r="1.1"/><circle cx="232" cy="183" r="1.8"/><circle cx="325" cy="307" r="1.1"/><circle cx="420" cy="125" r="1.3"/><circle cx="510" cy="225" r="1.1"/><circle cx="610" cy="91" r="1.6"/><circle cx="708" cy="180" r="1.2"/><circle cx="805" cy="104" r="1.3"/><circle cx="910" cy="210" r="1.5"/><circle cx="1010" cy="110" r="1.1"/><circle cx="1128" cy="210" r="1.8"/><circle cx="1222" cy="92" r="1.2"/><circle cx="1320" cy="180" r="1.3"/><circle cx="1420" cy="105" r="1.7"/><circle cx="1530" cy="240" r="1.1"/><circle cx="1630" cy="130" r="1.4"/><circle cx="1740" cy="205" r="1.2"/><circle cx="1830" cy="110" r="1.7"/><circle cx="100" cy="700" r="1.2"/><circle cx="300" cy="820" r="1.6"/><circle cx="490" cy="710" r="1.1"/><circle cx="710" cy="890" r="1.4"/><circle cx="910" cy="760" r="1.1"/><circle cx="1150" cy="900" r="1.5"/><circle cx="1320" cy="770" r="1.2"/><circle cx="1510" cy="850" r="1.4"/><circle cx="1700" cy="740" r="1.1"/><circle cx="1850" cy="890" r="1.6"/>
  </g>
  <g fill="#7e45ff" opacity=".9">
    <circle cx="270" cy="550" r="2"/><circle cx="480" cy="380" r="2.2"/><circle cx="1260" cy="510" r="1.8"/><circle cx="1580" cy="580" r="2.1"/><circle cx="1000" cy="320" r="1.7"/>
  </g>
  <g fill="#55dfff" opacity=".9">
    <circle cx="360" cy="260" r="1.7"/><circle cx="740" cy="560" r="2"/><circle cx="1440" cy="300" r="1.8"/><circle cx="1740" cy="460" r="1.7"/>
  </g>
  <g transform="translate(960 490)">
    <ellipse rx="620" ry="178" fill="#5724d6" opacity=".2" filter="url(#soft)"/>
    <ellipse rx="535" ry="130" fill="none" stroke="#6829ff" stroke-width="46" opacity=".25" filter="url(#glow)"/>
    <ellipse rx="535" ry="130" fill="none" stroke="url(#disk)" stroke-width="18" opacity=".9"/>
    <ellipse rx="480" ry="105" fill="none" stroke="#6beaff" stroke-width="4" opacity=".75">
      <animate attributeName="stroke-dasharray" values="60 24 120 40;120 40 60 24;60 24 120 40" dur="22s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="420" ry="84" fill="none" stroke="#c18aff" stroke-width="3" opacity=".7" stroke-dasharray="32 18 6 22">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="320" ry="56" fill="none" stroke="#ffcc7d" stroke-width="5" opacity=".85" stroke-dasharray="80 28 12 20">
      <animate attributeName="stroke-dashoffset" values="0;-240" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="172" fill="#000" stroke="#0d0b24" stroke-width="22"/>
    <circle r="182" fill="none" stroke="#f6c56b" stroke-width="3" opacity=".85" filter="url(#glow)"/>
    <circle r="196" fill="none" stroke="#5b35d7" stroke-width="2" opacity=".65">
      <animate attributeName="r" values="192;205;192" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;.8;.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g clip-path="url(#lowerDisk)" transform="translate(960 490)">
    <ellipse rx="535" ry="130" fill="none" stroke="url(#disk)" stroke-width="20" opacity=".8"/>
  </g>
  <g opacity=".9">
    <circle cx="270" cy="600" r="62" fill="#060914" stroke="#273d72" stroke-width="3"/>
    <path d="M215 580 Q270 540 325 590 M230 625 Q270 600 315 628" fill="none" stroke="#234d85" stroke-width="2" opacity=".7"/>
    <circle cx="1580" cy="370" r="28" fill="#080b1a" stroke="#5a3caa" stroke-width="2"/>
    <path d="M1557 365 Q1580 350 1603 370" fill="none" stroke="#9d72ff" stroke-width="2"/>
  </g>
  <g font-family="monospace" letter-spacing="5">
    <path d="M70 72 H460 M70 72 V155" fill="none" stroke="#8f5bff" stroke-width="2" opacity=".8"/>
    <text x="88" y="113" font-size="38" font-weight="bold" fill="url(#brand)">INNYGRCORP</text>
    <text x="91" y="143" font-size="12" letter-spacing="3" fill="#b8b6dc">INNOVATION TODAY. A BRIGHTER TOMORROW.</text>
    <path d="M1455 72 H1850 V155" fill="none" stroke="#39dfff" stroke-width="2" opacity=".8"/>
    <text x="1828" y="108" text-anchor="end" font-size="32" font-weight="bold" fill="url(#brand)">TEAM BLACKLIGHT</text>
    <text x="1828" y="140" text-anchor="end" font-size="12" letter-spacing="3" fill="#b8b6dc">BUILD / CREATE / EXPLORE / TOGETHER</text>
    <path d="M70 925 H410 M70 925 V1000 M1510 925 H1850 V1000" fill="none" stroke="#39dfff" stroke-width="2" opacity=".65"/>
    <text x="88" y="958" font-size="14" letter-spacing="2" fill="#6beaff">[ INNYGR :: INTEGEROS ]</text>
    <text x="88" y="984" font-size="12" letter-spacing="2" fill="#aaa8d5">KUBUNTU + KDE PLASMA</text>
    <text x="1825" y="958" text-anchor="end" font-size="13" letter-spacing="2" fill="#c2a2ff">BIGGER DREAMS.</text>
    <text x="1825" y="984" text-anchor="end" font-size="13" letter-spacing="2" fill="#c2a2ff">BOLDER BUILDS.</text>
    <text x="960" y="934" text-anchor="middle" font-size="36" font-weight="bold" letter-spacing="13" fill="url(#brand)">INTEGEROS</text>
    <text x="960" y="972" text-anchor="middle" font-size="13" letter-spacing="7" fill="#c6c5e8">BUILT FOR WHAT'S NEXT</text>
  </g>
  <g fill="#fff">
    <circle cx="480" cy="190" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1390" cy="620" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="820" r="1.7"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="270" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>