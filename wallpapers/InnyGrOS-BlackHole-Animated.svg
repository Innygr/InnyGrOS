<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Black Hole — Animated Space Wallpaper</title>
<desc>A clean, unbranded animated black hole in deep space with a glowing amber and blue accretion disk, subtle nebulae, and stars.</desc>
<defs>
 <radialGradient id="bg"><stop offset="0" stop-color="#10142a"/><stop offset=".52" stop-color="#060916"/><stop offset="1" stop-color="#010207"/></radialGradient>
 <radialGradient id="cloud"><stop stop-color="#4b38a8" stop-opacity=".36"/><stop offset=".55" stop-color="#175a91" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#17285b"/><stop offset=".18" stop-color="#598dff"/><stop offset=".32" stop-color="#b7dfff"/><stop offset=".43" stop-color="#ffdca0"/><stop offset=".52" stop-color="#fff4d7"/><stop offset=".64" stop-color="#e59b56"/><stop offset=".8" stop-color="#7e61e9"/><stop offset="1" stop-color="#17234d"/></linearGradient>
 <linearGradient id="thin" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#436aff" stop-opacity="0"/><stop offset=".22" stop-color="#9bcaff"/><stop offset=".48" stop-color="#fff0cb"/><stop offset=".72" stop-color="#a98aff"/><stop offset="1" stop-color="#436aff" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <g id="star"><circle r="1.4" fill="#e4edff"/><circle r="3.8" fill="#8ebcff" opacity=".3" filter="url(#glow)"/></g>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<ellipse cx="600" cy="460" rx="720" ry="500" fill="url(#cloud)"/>
<ellipse cx="1420" cy="620" rx="720" ry="460" fill="url(#cloud)" opacity=".65"/>
<g opacity=".8">
 <use href="#star" x="84" y="168"/><use href="#star" x="175" y="370"/><use href="#star" x="292" y="95"/><use href="#star" x="390" y="250"/><use href="#star" x="475" y="145"/><use href="#star" x="594" y="302"/><use href="#star" x="690" y="90"/><use href="#star" x="790" y="210"/><use href="#star" x="905" y="105"/><use href="#star" x="1040" y="190"/><use href="#star" x="1142" y="85"/><use href="#star" x="1265" y="245"/><use href="#star" x="1370" y="130"/><use href="#star" x="1485" y="210"/><use href="#star" x="1590" y="94"/><use href="#star" x="1710" y="265"/><use href="#star" x="1830" y="155"/>
 <use href="#star" x="110" y="600"/><use href="#star" x="235" y="820"/><use href="#star" x="365" y="690"/><use href="#star" x="505" y="930"/><use href="#star" x="650" y="790"/><use href="#star" x="790" y="960"/><use href="#star" x="960" y="820"/><use href="#star" x="1120" y="960"/><use href="#star" x="1280" y="790"/><use href="#star" x="1440" y="910"/><use href="#star" x="1600" y="740"/><use href="#star" x="1750" y="890"/><use href="#star" x="1860" y="660"/>
</g>
<g transform="translate(960 510)">
 <!-- Broad, soft light around the disk -->
 <ellipse rx="555" ry="150" fill="#6c63e8" opacity=".18" filter="url(#blur)"/>
 <ellipse rx="520" ry="136" fill="none" stroke="#4868ff" stroke-width="44" opacity=".25" filter="url(#glow)"/>
 <!-- Main accretion disk -->
 <ellipse rx="520" ry="132" fill="none" stroke="url(#ring)" stroke-width="27" opacity=".95"/>
 <ellipse rx="500" ry="119" fill="none" stroke="#d5e8ff" stroke-width="3" opacity=".78" stroke-dasharray="130 32 24 44">
  <animate attributeName="stroke-dashoffset" values="0;-460" dur="30s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="448" ry="99" fill="none" stroke="url(#thin)" stroke-width="5" opacity=".92" stroke-dasharray="210 48 70 35">
  <animate attributeName="stroke-dashoffset" values="0;363" dur="22s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="370" ry="78" fill="none" stroke="#f4c987" stroke-width="3" opacity=".7" stroke-dasharray="50 18 110 45">
  <animate attributeName="stroke-dashoffset" values="0;-446" dur="17s" repeatCount="indefinite"/>
 </ellipse>
 <!-- Event horizon -->
 <circle r="168" fill="#000" stroke="#080b19" stroke-width="23"/>
 <circle r="181" fill="none" stroke="#e6b976" stroke-width="4" opacity=".9" filter="url(#glow)"/>
 <circle r="192" fill="none" stroke="#728eff" stroke-width="2" opacity=".58">
  <animate attributeName="r" values="187;198;187" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".3;.72;.3" dur="8s" repeatCount="indefinite"/>
 </circle>
</g>
<!-- A few slow, subtle star glints -->
<g fill="#fff">
 <circle cx="410" cy="450" r="2"><animate attributeName="opacity" values=".2;.9;.2" dur="4.7s" repeatCount="indefinite"/></circle>
 <circle cx="1480" cy="350" r="1.8"><animate attributeName="opacity" values=".9;.25;.9" dur="3.8s" repeatCount="indefinite"/></circle>
 <circle cx="1320" cy="790" r="1.5"><animate attributeName="opacity" values=".25;1;.25" dur="5.1s" repeatCount="indefinite"/></circle>
 <circle cx="620" cy="735" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
</g>
</svg>