<?xml version="1.0" encoding="UTF-8"?>
<!-- InnyGrOS logo mark. Hand-authored geometry only (no fonts), so it renders
     the same everywhere and can be used as an application icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>InnyGrOS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14122a"/>
      <stop offset="1" stop-color="#071520"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b18cff"/>
      <stop offset="1" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4adff"/>
      <stop offset="1" stop-color="#7651ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77f7ff"/>
      <stop offset="1" stop-color="#00bcd4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7046ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7046ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>
  <!-- Hexagon frame -->
  <path d="M128 34 L209.4 81 L209.4 175 L128 222 L46.6 175 L46.6 81 Z" fill="none" stroke="url(#edge)" stroke-width="9" stroke-linejoin="round"/>
  <!-- "I" -->
  <rect x="72" y="88" width="18" height="80" rx="5" fill="url(#violet)"/>
  <!-- "G" -->
  <path d="M165 102.5 A36 36 0 1 0 176 128 H142" fill="none" stroke="url(#cyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent node -->
  <circle cx="209.4" cy="81" r="9" fill="#77f7ff"/>
</svg>
