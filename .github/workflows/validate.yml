name: Validate InnyGrOS scripts and assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(find . -type f \( -name '*.sh' -o -path './apps/welcome-center/innygros-welcome' \) -print0)

      - name: ShellCheck (warnings and errors)
        run: shellcheck -S warning $(git ls-files '*.sh') apps/welcome-center/innygros-welcome

      - name: Software updater CLI smoke test
        run: bash ./tests/software-updater-fixture.sh

      - name: Wallpaper chooser smoke test
        run: bash ./tests/wallpaper-fixture.sh

      - name: Run read-only performance snapshot
        shell: bash
        run: |
          set -euo pipefail
          # Smoke test only: CI runners are not InnyGrOS hardware, so the numbers mean nothing.
          ./scripts/performance-benchmark.sh --text --no-save --no-cpu
          ./scripts/performance-benchmark.sh --help >/dev/null
          if ./scripts/performance-benchmark.sh --not-an-option >/dev/null 2>&1; then
            echo "Unknown options should be rejected"; exit 1
          fi

      - name: Network diagnostics smoke test
        run: bash ./tests/network-check-fixture.sh

      - name: Quick network and battery report smoke tests
        shell: bash
        run: |
          set -euo pipefail
          network_report="$(timeout 20 bash ./scripts/network-health.sh)"
          grep -q 'InnyGrOS Network Health' <<<"$network_report"
          grep -q 'made no configuration changes' <<<"$network_report"
          battery_report="$(timeout 20 bash ./scripts/battery-power-report.sh)"
          grep -q 'InnyGrOS Battery & Power' <<<"$battery_report"
          grep -q 'No battery serial numbers are printed' <<<"$battery_report"
          echo "Quick network and battery reports completed without changing settings."

      - name: Boot manager syntax and safety smoke test
        run: bash ./tests/boot-manager-fixture.sh

      - name: Hardware check against a fake ThinkPad sysfs tree
        run: |
          ./scripts/hardware-check.sh --text --no-save
          ./tests/hardware-check-fixture.sh

      - name: Snapshot comparison
        run: ./tests/compare-reports-fixture.sh

      - name: Power mode
        run: ./tests/power-mode-fixture.sh

      - name: Game tool detection
        run: |
          ./tests/game-tools-fixture.sh
          ./scripts/game-readiness.sh

      - name: Install KDE config tools for desktop profile test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libkf5config-bin
          # Qt 6 and Qt 5 QML runtimes for the splash screen render test.
          sudo apt-get install -y -q qml-qt6 qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript libqt6svg6 \
            qmlscene qml-module-qtquick2 qml-module-qtquick-window2 libqt5svg5

      - name: Splash screen renders with Qt 6 and Qt 5
        run: ./tests/splash-render.sh

      - name: Desktop profile apply/restore round trip
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)" XDG_CONFIG_HOME= XDG_DATA_HOME=
          mkdir -p "$HOME/.config" "$HOME/.local/share/konsole"
          printf '[General]\nColorScheme=BreezeDark\n\n[KDE]\nSingleClick=false\n' > "$HOME/.config/kdeglobals"
          touch "$HOME/.local/share/konsole/InnyGrOS.profile"
          ./scripts/desktop-profile.sh status
          ./scripts/desktop-profile.sh apply --dry-run --animations faster
          cmp "$HOME/.config/kdeglobals" <(printf '[General]\nColorScheme=BreezeDark\n\n[KDE]\nSingleClick=false\n')
          ./scripts/desktop-profile.sh apply --yes --animations faster --no-wallpaper --splash
          test "$(kreadconfig5 --file ksplashrc --group KSplash --key Theme)" = org.innygros.splash
          test -f "$HOME/.local/share/plasma/look-and-feel/org.innygros.splash/contents/splash/Splash.qml"
          test "$(kreadconfig5 --file kdeglobals --group General --key ColorScheme)" = InnyGrOS
          test "$(kreadconfig5 --file kdeglobals --group KDE --key AnimationDurationFactor)" = 0.5
          test "$(kreadconfig5 --file konsolerc --group 'Desktop Entry' --key DefaultProfile)" = InnyGrOS.profile
          ./scripts/desktop-profile.sh restore --yes
          test "$(kreadconfig5 --file kdeglobals --group General --key ColorScheme)" = BreezeDark
          test -z "$(kreadconfig5 --file kdeglobals --group KDE --key AnimationDurationFactor)"
          test -z "$(kreadconfig5 --file konsolerc --group 'Desktop Entry' --key DefaultProfile)"
          test "$(kreadconfig5 --file kdeglobals --group KDE --key SingleClick)" = false
          test -z "$(kreadconfig5 --file ksplashrc --group KSplash --key Theme)"
          echo "Desktop profile round trip restored the original settings."

      - name: Welcome Center smoke test with stub kdialog
        shell: bash
        run: |
          set -euo pipefail
          stub="$(mktemp -d)"
          # Fake kdialog: picks "about", then "diagnostics", then "quit".
          cat > "$stub/kdialog" <<'STUB'
          #!/usr/bin/env bash
          echo "kdialog $*" >> "$KDIALOG_LOG"
          for arg in "$@"; do
            if [[ "$arg" == --menu ]]; then
              n=$(cat "$KDIALOG_STATE" 2>/dev/null || echo 0); echo $((n + 1)) > "$KDIALOG_STATE"
              case "$n" in 0) echo about ;; 1) echo diagnostics ;; *) echo quit ;; esac
            fi
          done
          STUB
          chmod +x "$stub/kdialog"
          export KDIALOG_LOG="$stub/log" KDIALOG_STATE="$stub/state" DISPLAY=:99 HOME="$(mktemp -d)" XDG_STATE_HOME=
          PATH="$stub:$PATH" timeout 60 ./apps/welcome-center/innygros-welcome
          grep -q -- '--textbox' "$KDIALOG_LOG"
          grep -q "Helpers: $PWD/scripts" "$KDIALOG_LOG"
          # First launch shows the first-steps guide once, then remembers it.
          grep -q "InnyGrOS first steps" "$KDIALOG_LOG"
          test -f "$HOME/.local/state/innygros/first-run-done"
          : > "$KDIALOG_LOG"; rm -f "$KDIALOG_STATE"
          PATH="$stub:$PATH" timeout 60 ./apps/welcome-center/innygros-welcome
          if grep -q "InnyGrOS first steps" "$KDIALOG_LOG"; then echo "First-steps guide shown twice"; exit 1; fi
          echo "Welcome Center menu loop, About, and diagnostics ran without hanging."

      - name: Installer checks and recovery round trip
        shell: bash
        run: |
          set -euo pipefail
          ./install.sh --check
          # Without a terminal the installer must refuse before changing anything.
          if ./install.sh </dev/null; then echo "install.sh should refuse without a terminal"; exit 1; fi
          ./scripts/install-apps.sh --list </dev/null

          export HOME="$(mktemp -d)" XDG_CONFIG_HOME= XDG_DATA_HOME=
          mkdir -p "$HOME/.config"
          printf '[General]\nColorScheme=BreezeDark\n' > "$HOME/.config/kdeglobals"
          ./scripts/install-welcome-center.sh
          ./scripts/desktop-profile.sh apply --yes --no-wallpaper --no-konsole-default
          # The runner has no kdialog, so doctor reports a failure; check the rest of its report.
          doctor="$(./scripts/doctor.sh || true)"
          printf '%s\n' "$doctor"
          grep -q '^OK    Installed version' <<<"$doctor"
          grep -q '^OK    InnyGrOS icon installed' <<<"$doctor"
          grep -q '^FAIL  kdialog not installed' <<<"$doctor"
          ./scripts/restore-defaults.sh --dry-run
          test -f "$HOME/.local/bin/innygros-welcome"
          grep -qx "Icon=innygros" "$HOME/.local/share/applications/innygros-welcome.desktop"
          test -f "$HOME/.local/share/icons/hicolor/scalable/apps/innygros.svg"
          ./scripts/restore-defaults.sh --yes
          test "$(kreadconfig5 --file kdeglobals --group General --key ColorScheme)" = BreezeDark
          test ! -e "$HOME/.local/bin/innygros-welcome"
          test ! -e "$HOME/.local/share/icons/hicolor/scalable/apps/innygros.svg"
          test ! -e "$HOME/.local/share/innygros/scripts"
          ls "$HOME"/.local/share/innygros/backups/removed-*/.local/bin/innygros-welcome
          echo "Recovery restored settings and moved InnyGrOS files into a backup."

      - name: Version is consistent
        shell: bash
        run: |
          set -euo pipefail
          version="$(head -n 1 VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "VERSION is not a version number: ${version}"; exit 1; }
          grep -q "^\*\*InnyGrOS ${version} " README.md || { echo "README header does not mention ${version}"; exit 1; }
          grep -q "^## ${version} " CHANGELOG.md || { echo "CHANGELOG.md has no entry for ${version}"; exit 1; }
          if grep -rnE 'VERSION="[0-9]' --include='*.sh' . apps/welcome-center/innygros-welcome; then
            echo "Hard-coded version found; read the VERSION file instead"; exit 1
          fi
          echo "Version ${version} is consistent."

      - name: Splash package metadata
        run: |
          python3 - <<'CHECK'
          import json, filecmp
          base = "branding/splash/org.innygros.splash"
          meta = json.load(open(f"{base}/metadata.json"))
          assert meta["KPackageStructure"] == "Plasma/LookAndFeel", meta
          assert meta["KPlugin"]["Id"] == "org.innygros.splash", meta
          assert "X-KDE-PluginInfo-Name=org.innygros.splash" in open(f"{base}/metadata.desktop").read()
          assert filecmp.cmp(f"{base}/contents/splash/images/logo.svg", "branding/logo/innygros-logo.svg", shallow=False), "splash logo copy is out of date"
          print("Splash package metadata OK")
          CHECK

      - name: Validate SVG assets
        shell: bash
        run: |
          set -euo pipefail
          for svg in $(git ls-files '*.svg'); do
            python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$svg"
            echo "Well-formed: $svg"
          done

      - name: Check required starter files
        shell: bash
        run: |
          set -euo pipefail
          for file in VERSION CHANGELOG.md branding/splash/org.innygros.splash/metadata.json branding/splash/org.innygros.splash/contents/splash/Splash.qml branding/logo/innygros-logo.svg install.sh README.md config/themes/InnyGrOS.colors scripts/apply-wallpaper.sh scripts/apply-terminal-profile.sh scripts/game-readiness.sh scripts/performance-benchmark.sh scripts/desktop-profile.sh scripts/restore-defaults.sh scripts/install-apps.sh scripts/hardware-check.sh scripts/compare-reports.sh scripts/power-mode.sh scripts/doctor.sh scripts/boot-manager.sh scripts/lib/game-tools.sh docs/boot-manager.md tests/boot-manager-fixture.sh docs/thinkpad-t580-test-plan.md docs/recovery.md config/konsole/InnyGrOS.profile config/konsole/InnyGrOS.colorscheme apps/welcome-center/innygros-welcome; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
